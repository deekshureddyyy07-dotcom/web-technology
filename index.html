<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your account">
  <title>Sign In</title>
</head>
<body>

  <header>
    <h1>Welcome Back</h1>
    <p>Please sign in to your account.</p>
  </header>

  <main>
    <form action="/login" method="post" autocomplete="on">
      <fieldset>
        <legend>Account Login</legend>

        <p>
          <label for="email">Email address</label><br>
          <input type="email" id="email" name="email"
                 placeholder="you@example.com"
                 autocomplete="username" required>
        </p>

        <p>
          <label for="password">Password</label><br>
          <input type="password" id="password" name="password"
                 placeholder="Enter your password"
                 minlength="8" autocomplete="current-password" required>
        </p>

        <p>
          <input type="checkbox" id="remember" name="remember">
          <label for="remember">Remember me</label>
        </p>

        <p>
          <button type="submit">Sign In</button>
        </p>
      </fieldset>
    </form>

    <nav aria-label="Account help">
      <p><a href="/forgot-password">Forgot your password?</a></p>
      <p>Don't have an account? <a href="/register">Create one</a></p>
    </nav>
  </main>

  <footer>
    <hr>
    <p><small>&copy; 2026 Your Company. All rights reserved.</small></p>
    <p><small><a href="/privacy">Privacy Policy</a> | <a href="/terms">Terms of Service</a></small></p>
  </footer>

</body>
</html> -->
